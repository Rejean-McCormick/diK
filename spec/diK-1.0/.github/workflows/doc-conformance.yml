name: diK specification conformance
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.21,<5'
      - run: python tools/validate_documentation.py
      - run: python tools/verify_reference_vectors.py
